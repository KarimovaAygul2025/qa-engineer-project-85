---
functional:
  - Пользователь должен иметь возможность создать игру (кнопка Create game)
  - Создание игры доступно только авторизованным пользователям
  - Язык программирования выбирается после создания игры, в процессе игры
  - Второй игрок должен иметь возможность подключиться к игре (кнопка Connect to game)
  - Игра должна отображаться в списке доступных для подключения
  - Система должна поддерживать режим ожидания второго игрока
  - Оба игрока переносятся в игровое пространство при подключении
  - Пользователь должен видеть задание сверху и время игры под ним
  - Должны быть два редактора кода слева — свой, справа — соперника
  - Синхронизация кода в реальном времени (видно, что печатает соперник)
  - Кнопка Check должна запускать проверку решения (неограниченное количество попыток)
  - Тесты запускаются только на локальном коде игрока, не на коде соперника
  - Игра длится до первого успешного решения (без таймера на победу)
  - При успешной проверке должно отображаться модальное окно с определением победителя
  - Победитель кнопка Check блокируется, появляется кнопка Exit
  - Проигравший может продолжать писать и проверять код или выйти из игры
  - Игра удаляется из памяти только после выхода обоих игроков
  - Система должна поддерживать матчмейкинг (очередь или список активных игр)
  - Поддержка переподключения при разрыве соединения
  - В будущем чат слева от редакторов
non-functional:
  - Связь между игроками в реальном времени (WebSocket или аналог)
  - Реализация двусторонней синхронизации кода (Operational Transformation или CRDT)
  - Поддержка восстановления сессии по ID
  - Фронтенд — SPA без перезагрузки страницы (React, Redux)
  - Бэкенд на Elixir (Phoenix Framework)
  - Тесты к играм на Clojure
  - Разработка через docker-compose
  - Развёртывание окружения одной командой (ansible)
  - Весь код проходит через линтеры
  - JS-часть тестируется через Jest (jsdom) и React
  - Основные тесты — тесты контроллеров
  - Unit-тесты для функций со сложной логикой
  - Строки текста только через локализацию
  - Следование принципам 12-factor app
implicit:
  - Система должна поддерживать множество языков программирования
  - Состояние игры active, finished (один победил), closed (оба вышли)
  - Данные игры хранятся до полного завершения сессии
  - Поддержка одновременных игр
  - Код игроков изолирован — проверка только своего кода
  - Игра доступна пользователям разного уровня подготовки
  - Проект с открытым исходным кодом, разрабатывается сообществом
  - Существует Chrome-расширение для интеграции с платформой

