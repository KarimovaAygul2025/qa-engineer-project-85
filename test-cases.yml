---
- summary: |
    Проверка входа пользователя с существующими логином и паролем
  requirement: |
    При верном вводе логине и пароля пользователь должен войти в систему
  prerequisites: |
    открыта страница логина
  test-data: |
    Тестовые данные
    Логин = ilona Пароль = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу

- summary: |
    Проверка входа пользователя с правильным логином и неправильным паролем
  requirement: |
    При неправильном логине или пароле пользователь должен получить сообщение об ошибке
  prerequisites:
    Открыта страница логина
  test-data: |
    Логин = karimova20252025@mail.ru Пароль = q1w2e3r4t5 
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен получить сообщение об ошибке

- summary: |
    Проверка отправки и отображения текстового сообщения в реальном времени в общем чате.
  requirement: |
    Авторизованный пользователь должен иметь возможность отправить сообщение, которое мгновенно отобразится в окне чата у него и у других участников.
  prerequisites:
    Пользователь авторизован на сайте. Открыта страница с общим чатом. Статус интернет-соединения стабильное.
  test-data: |
    Текст сообщения: "Привет всем! Тестирую чат." 
  steps:
    - Нажать на поле ввода сообщения (input field) в нижней части чата.
    - Ввести с клавиатуры тестовые данные "Привет всем! Тестирую чат."
    - Нажать кнопку «Отправить» (или клавишу Enter).
  expected-result: |
    Сообщение появилось в ленте чата. Поле ввода очистилось. Рядом с сообщением корректно отображается имя отправителя и текущее время.

- summary: |
   Проверка блокировки отправки сообщения, если поле ввода пустое или содержит только пробелы.
  requirement: |
   Система не должна позволять отправку пустого сообщения. Кнопка отправки должна быть неактивна, либо пользователю должно выводиться предупреждение.
  prerequisites:
   Пользователь авторизован на сайте и находится на странице общего чата. Поле ввода сообщения пустое.
  test-data: |
   Пустая строка или строка из пробелов (" ")
  steps:
    - Убедиться, что в поле ввода нет текста.
    - Попробовать нажать кнопку «Отправить».
    - Ввести в поле несколько пробелов и нажать клавишу Enter.
  expected-result: |
    Сообщение не добавилось в ленту чата. Поле ввода осталось пустым
    
- summary: |
   Отправка сообщения, превышающего максимально допустимую длину
  requirement: |
   Система должна ограничивать ввод текста или выдавать ошибку, если сообщение слишком длинное. Сообщение, превышающее лимит, не должно сохраняться в базе и отображаться в чате.
  prerequisites:
   Пользователь авторизован и находится в общем чате. Известен лимит символов (1024)
  test-data: |
   Строка длиной 1024 символ (например, сгенерированный текст "Работу разработчика часто можно сравнить с решением головоломок.....").
  steps:
    - Скопировать подготовленную строку длиной 1158 символов
    - Вставить текст в поле ввода сообщения.
    - Попробовать нажать кнопку «Отправить».
  expected-result: |
    Система блокирует отправку. Возможные варианты: Кнопка «Отправить» становится неактивной.Появляется сообщение об ошибке «Превышен лимит символов».Сообщение не появляется в ленте чата.

