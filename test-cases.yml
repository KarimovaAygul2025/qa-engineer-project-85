---
- summary: |
    Успешный вход пользователя с существующими логином и паролем
  requirement: |
    При верном вводе логине и пароля пользователь должен войти в систему
  prerequisites: |
    открыта страница логина
  test-data: |
    Тестовые данные
    Логин = ilona Пароль = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу

- summary: |
    Неуспешный вход пользователя с правильным логином и неправильным паролем
  requirement: |
    При неправильном логине или пароле пользователь должен получить сообщение об ошибке
  prerequisites:
    Открыта страница логина
  test-data: |
    Логин = karimova20252025@mail.ru Пароль = q1w2e3r4t5 
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен получить сообщение об ошибке

- summary: |
    Отправка сообщения в общем чате.
  requirement: |
    Авторизованный пользователь должен иметь возможность отправить сообщение, которое мгновенно отобразится в окне чата у него и у других участников.
  prerequisites:
    Пользователь авторизован на сайте. Открыта страница с общим чатом. Статус интернет-соединения стабильное.
  test-data: |
    Текст сообщения: "Привет всем! Тестирую чат." 
  steps:
    - Нажать на поле ввода сообщения (input field) в нижней части чата.
    - Ввести с клавиатуры тестовые данные "Привет всем! Тестирую чат."
    - Нажать кнопку «Отправить» (или клавишу Enter).
  expected-result: |
    Сообщение появилось в ленте чата. Поле ввода очистилось. Рядом с сообщением корректно отображается имя отправителя и текущее время.

- summary: |
   Блокировка отправки сообщения, если поле ввода пустое или содержит только пробелы.
  requirement: |
   Система не должна позволять отправку пустого сообщения. Кнопка отправки должна быть неактивна, либо пользователю должно выводиться предупреждение.
  prerequisites:
   Пользователь авторизован на сайте и находится на странице общего чата. Поле ввода сообщения пустое.
  test-data: |
   Пустая строка или строка из пробелов (" ")
  steps:
    - Убедиться, что в поле ввода нет текста.
    - Попробовать нажать кнопку «Отправить».
    - Ввести в поле несколько пробелов и нажать клавишу Enter.
  expected-result: |
    Сообщение не добавилось в ленту чата. Поле ввода осталось пустым
    
- summary: |
   Блокировка отправки сообщения, превышающего максимально допустимую длину
  requirement: |
   Система должна ограничивать ввод текста или выдавать ошибку, если сообщение слишком длинное. Сообщение, превышающее лимит, не должно сохраняться в базе и отображаться в чате.
  prerequisites:
   Пользователь авторизован и находится в общем чате. Известен лимит символов (1024)
  test-data: |
   Строка длиной 1024 символ (например, сгенерированный текст "Работу разработчика часто можно сравнить с решением головоломок.....").
  steps:
    - Скопировать подготовленную строку длиной 1158 символов
    - Вставить текст в поле ввода сообщения.
    - Попробовать нажать кнопку «Отправить».
  expected-result: |
    Система блокирует отправку. Возможные варианты: Кнопка «Отправить» становится неактивной.Появляется сообщение об ошибке «Превышен лимит символов».Сообщение не появляется в ленте чата.

- summary: |
    Победа при первом успешном решении
  requirement: |
    При успешной проверке — модальное окно: победитель определён. Игра идёт до первого успешного решения.
  prerequisites: |
    Оба игрока в игре. Никто ещё не решил задачу.
  test-data: |
    Игрок 1 вводит корректное решение и нажимает «Check».
  steps:
    - Игрок 1 написать корректное решение
    - Нажать «Check»
    - Дождаться прохождения тестов
  expected-result: |
    Отображается модальное окно «Победитель определён». У Игрока 1 кнопка «Check» блокируется, появляется кнопка «Exit». Игрок 1 может остаться и смотреть код.

- summary: |
    Поведение проигравшего после определения победителя
  requirement: |
    Проигравший может продолжать писать и проверять (но победитель уже найден). Может выйти.
  prerequisites: |
    Игрок 2 проиграл — соперник первым решил задачу.
  test-data: |
    Игрок 1 уже победил. Игрок 2 — проигравший.
  steps:
    - Убедиться, что модальное окно о победе отображается
    - Проверить доступность редактора и кнопки «Check» у Игрока 2
    - Нажать «Exit» (если доступна)
  expected-result: |
    Игрок 2 может продолжать писать и нажимать «Check». Может выйти по кнопке «Exit». Игра удаляется из памяти только после выхода обоих.

- summary: |
    Выход из игры (сдача) проигравшим
  requirement: |
    Проигравший может выйти. Игра удаляется из памяти только после выхода обоих.
  prerequisites: |
    Игра в состоянии finished (победитель определён) или active.
  test-data: |
    Игрок 2 хочет выйти из игры.
  steps:
    - Нажать кнопку «Exit» / «Сдаться» (если доступна)
    - Подтвердить выход (если требуется)
  expected-result: |
    Игрок выходит из игрового пространства. Если вышел только один — игра остаётся в памяти. После выхода обоих — игра закрывается (состояние closed).

- summary: |
    Завершение игры по таймеру (режим с ограничением времени)
  requirement: |
    В режиме с таймером побеждает тот, кто первым решит задачу за отведённое время.
  prerequisites: |
    Игра создана с ограничением по времени. Оба игрока подключены.
  test-data: |
    Время игры = 5 минут. Никто не решил задачу до истечения времени.
  steps:
    - Дождаться истечения времени
    - Проверить отображение результата
  expected-result: |
    По истечении времени игра завершается. Отображается результат (ничья или победа по очкам, если такая логика реализована). Кнопка «Check» блокируется, доступна кнопка «Exit».

- summary: |
    Закрытие игры после выхода обоих игроков
  requirement: |
    Игра удаляется из памяти только после выхода обоих. Состояние: closed (оба вышли).
  prerequisites: |
    Игра в состоянии finished. Один игрок уже вышел.
  test-data: |
    Игрок 1 вышел. Игрок 2 ещё в игре.
  steps:
    - Игрок 2 нажать «Exit»
    - Проверить, что игра больше не отображается в списке активных
  expected-result: |
    После выхода обоих игроков игра переходит в состояние closed. Сессия удаляется. Игра не отображается в списке доступных.
